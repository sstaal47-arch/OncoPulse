<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OncoPulse — Digest Preferences</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1829; --surface: #162035; --surface2: #1c2a42; --border: #2a3d5c;
    --accent: #4d9fff; --accent3: #ff6b6b; --text: #f0f4ff; --text-muted: #8ea8cc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; color: var(--accent); margin-bottom: 4px; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 32px; }
  label { display: block; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); margin: 24px 0 8px; }
  input[type=email], input[type=number] {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 12px 14px; font-family: 'DM Mono', monospace; font-size: 14px; outline: none;
  }
  input[type=email]:focus, input[type=number]:focus { border-color: var(--accent); }
  .back-link { display: inline-block; color: var(--text-muted); font-size: 13px; text-decoration: none; margin-bottom: 24px; }
  .back-link:hover { color: var(--accent); }
  .hint { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; line-height: 1.5; }
  .groups { display: flex; flex-direction: column; gap: 8px; }
  .group-chip {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; user-select: none; min-height: 48px;
  }
  .group-chip:hover { border-color: var(--accent); }
  .group-chip.checked { border-color: var(--accent); background: rgba(77,159,255,0.12); color: var(--accent); }
  .group-chip .site-toggle { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; text-transform: none; letter-spacing: 0; margin: 0; font-size: 13px; color: inherit; }
  .group-chip input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .group-chip .site-count { display: none; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .group-chip.checked .site-count { display: flex; }
  .group-chip .site-count input { width: 64px; padding: 6px 8px; font-size: 13px; }
  .actions { margin-top: 32px; display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; border-radius: 8px; padding: 12px 20px;
    cursor: pointer; border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: #0f1829; border: none; }
  .btn-primary:hover { opacity: .9; }
  .btn-danger { background: transparent; border: 1px solid var(--accent3); color: var(--accent3); }
  .btn-danger:hover { background: rgba(255,107,107,0.1); }
  .status { margin-top: 20px; font-size: 13px; padding: 14px; border-radius: 8px; display: none; }
  .status.ok { display: block; background: rgba(77,159,255,0.1); border: 1px solid var(--accent); color: var(--accent); }
  .status.err { display: block; background: rgba(255,107,107,0.1); border: 1px solid var(--accent3); color: var(--accent3); }
  .manage-link { word-break: break-all; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">&larr; Back to dashboard</a>
  <div class="logo">OncoPulse</div>
  <div class="subtitle">Pick the disease sites you follow. Each site arrives as its own email, about 30 minutes after the weekly Monday update, with as many top-ranked abstracts as you choose for that site.</div>

  <label for="email">Email address</label>
  <input id="email" type="email" placeholder="you@hospital.org" autocomplete="email">

  <label>Disease sites</label>
  <div class="hint">Tick a site, then set how many abstracts (1–20) its email should include.</div>
  <div class="groups" id="groups"></div>

  <div class="actions">
    <button class="btn-primary" id="saveBtn">Save preferences</button>
    <button class="btn-danger" id="unsubBtn" style="display:none;">Unsubscribe</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // ── Fill these in after creating your Supabase project ──
  // The anon key is safe to expose client-side: every table access it can
  // make is locked down by RLS + the RPC functions in supabase/schema.sql.
  const SUPABASE_URL = "https://bfzsgrrtxbucfkjanpfg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Y5K_nusKkKUArYFojlpQ3g_gdbGnOa_";

  // Named `sb`, not `supabase` — the UMD build's own global is already called
  // `window.supabase`, and redeclaring that name throws a SyntaxError that
  // silently kills the whole script.
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Mirrors pipeline/disease_groups.json / dashboard/index.html BROAD_GROUPS.
  // Keep the `id`s in sync — these are what gets stored in subscribers.disease_sites.
  const GROUPS = [
    { id: 'lymphoma',    label: 'Lymphoma' },
    { id: 'leukemia',    label: 'Leukemia' },
    { id: 'myeloma',     label: 'Myeloma / Plasma Cell' },
    { id: 'lung',        label: 'Lung' },
    { id: 'breast',      label: 'Breast' },
    { id: 'gi',          label: 'GI' },
    { id: 'gu',          label: 'GU' },
    { id: 'cns',         label: 'CNS' },
    { id: 'gynecologic', label: 'Gynecologic' },
    { id: 'skin',        label: 'Skin' },
    { id: 'head_neck',   label: 'Head & Neck' },
    { id: 'sarcoma',     label: 'Sarcoma' },
    { id: 'other',       label: 'General / Other' },
  ];

  const groupsEl = document.getElementById('groups');
  const DEFAULT_N = 5;
  const clampN = v => Math.min(20, Math.max(1, parseInt(v, 10) || DEFAULT_N));

  GROUPS.forEach(g => {
    const row = document.createElement('div');
    row.className = 'group-chip';
    row.dataset.site = g.id;
    row.innerHTML = `
      <label class="site-toggle"><input type="checkbox" value="${g.id}"> ${g.label}</label>
      <span class="site-count">
        <input type="number" min="1" max="20" value="${DEFAULT_N}" aria-label="Abstracts for ${g.label}">
        abstracts
      </span>`;
    row.querySelector('input[type=checkbox]').addEventListener('change', e => {
      row.classList.toggle('checked', e.target.checked);
    });
    groupsEl.appendChild(row);
  });

  // { site_id: n } for every ticked site
  function selectedSiteCounts() {
    const out = {};
    groupsEl.querySelectorAll('.group-chip').forEach(row => {
      if (row.querySelector('input[type=checkbox]').checked) {
        out[row.dataset.site] = clampN(row.querySelector('input[type=number]').value);
      }
    });
    return out;
  }
  function setSiteCounts(counts) {
    groupsEl.querySelectorAll('.group-chip').forEach(row => {
      const site = row.dataset.site;
      const checked = Object.prototype.hasOwnProperty.call(counts, site);
      row.querySelector('input[type=checkbox]').checked = checked;
      row.querySelector('input[type=number]').value = checked ? clampN(counts[site]) : DEFAULT_N;
      row.classList.toggle('checked', checked);
    });
  }
  function showStatus(msg, ok) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (ok ? 'ok' : 'err');
  }
  function errText(error) {
    return error && error.message ? ` (${error.message})` : '';
  }

  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const unsubBtn = document.getElementById('unsubBtn');
  const emailInput = document.getElementById('email');

  async function loadExisting() {
    if (!token) return;
    const { data, error } = await sb.rpc('get_subscriber_v2', { p_token: token });
    if (error || !data || !data.length) {
      showStatus('That preferences link is no longer valid.', false);
      return;
    }
    const sub = data[0];
    emailInput.value = sub.email;
    emailInput.disabled = true; // email is the identity key; changing it means re-subscribing below
    // Older rows only have disease_sites + one top_n; spread that across each site.
    let counts = sub.site_top_n;
    if (!counts || !Object.keys(counts).length) {
      counts = {};
      (sub.disease_sites || []).forEach(s => { counts[s] = sub.top_n || DEFAULT_N; });
    }
    setSiteCounts(counts);
    unsubBtn.style.display = 'inline-block';

    if (params.get('action') === 'unsubscribe') {
      await doUnsubscribe();
    }
  }

  async function doUnsubscribe() {
    const { error } = await sb.rpc('unsubscribe', { p_token: token });
    showStatus(error ? 'Could not unsubscribe. Please try again.' + errText(error) : 'You have been unsubscribed. You will not receive any more digest emails.', !error);
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const counts = selectedSiteCounts();
    const nSites = Object.keys(counts).length;

    if (!email || !emailInput.checkValidity() || nSites === 0) {
      showStatus('Enter a valid email address and pick at least one disease site.', false);
      return;
    }
    const summary = `${nSites} disease site${nSites === 1 ? '' : 's'}, so you will get ${nSites} separate email${nSites === 1 ? '' : 's'} each Monday, about 30 minutes after the weekly update. A site with no new articles that week sends no email.`;

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
    if (token) {
      const { error } = await sb.rpc('update_preferences_v2', { p_token: token, p_site_top_n: counts });
      showStatus(error ? 'Could not save changes.' + errText(error) : `Preferences updated: ${summary}`, !error);
    } else {
      const { data: newToken, error } = await sb.rpc('subscribe_v2', { p_email: email, p_site_top_n: counts });
      if (error) {
        showStatus('Could not subscribe. Please try again.' + errText(error), false);
      } else {
        const manageUrl = `${location.origin}${location.pathname}?token=${newToken}`;
        showStatus(`Subscribed to ${summary} Bookmark this link to change your preferences later. It is also at the bottom of every digest email.`, true);
        document.getElementById('status').insertAdjacentHTML('beforeend', `<div class="manage-link">${manageUrl}</div>`);
      }
    }
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = 'Save preferences';
    }
  });

  unsubBtn.addEventListener('click', doUnsubscribe);

  loadExisting();
</script>
</body>
</html>
